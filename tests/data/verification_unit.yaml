rating_indoor_wet_bulb:       {value: 19.4, unit: degC, source: verification-only, status: assumption}
rating_reference:             {value: coil_inlet, unit: "-", source: verification-only, status: assumption}
rating_outdoor_rh:            {value: 0.40, unit: "-", source: verification-only, status: assumption}
rated_shr:                    {value: 0.75, unit: "-", source: verification-only, status: assumption}
supply_airflow:               {value: 6000, unit: m3/h, source: verification-only, status: assumption}
fresh_airflow:                {value: 1200, unit: m3/h, source: verification-only, status: assumption}
fan_power:                    {value: 1500, unit: W, source: verification-only, status: assumption}
