# VERIFICATION-ONLY unit card. Round numbers chosen to exercise the maths of
# core.unit (rating point loosely AHRI-like). This is NOT data for any real
# unit; every field is therefore marked as an assumption.

unit_id: verification_unit
name: Verification unit (maths check only)

rated_total_cooling_capacity: {value: 30, unit: kW, source: verification-only, status: assumption}
rating_outdoor_dry_bulb:      {value: 35, unit: degC, source: verification-only, status: assumption}
