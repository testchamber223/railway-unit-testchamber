[project]
name = "railway-hvac-sim"
version = "0.0.1"
description = "Evidence-based virtual test facility for railway HVAC units"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-rs"
markers = [
    "fluent: needs a local Ansys Fluent install and RUN_FLUENT=1 (launches Fluent, about 1-2 min)",
]
